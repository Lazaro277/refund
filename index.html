<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refund</title>
  <link rel="shortcut icon" href="assets/images/favicon.svg" type="image/x-icon">

  <!-- BootStrap -->
  <link href="css/bootstrap/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- BootStrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="css/index.css">

  <!-- JavaScript -->
  <script src="js/scripts.js" defer></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
</head>

<body class="container">
  <h1 id="logo" class="mt-5 mb-4">Refund</h1>

  <main>
    <div id="refund-request">
      <h2 class="h4 fw-bold mb-3 gray-100">Solicitação de reembolso</h2>
      <p class="fs-6 gray-200 mb-5">Informe os dados da despesa para solicitar reembolso. <br>
        A despesa será analisada e reembolsada em até 30 dias.</p>

      <form>

        <div class="mb-3">
          <label for="company-title" class="form-label">Título da despesa</label>
          <input type="text" id="company-title" class="form-control form-control-lg border-radius-0_7"
            placeholder="Insira um título">
        </div>

        <div class="mb-3">
          <label for="category" class="form-label">Categoria</label>
          <select id="category" class="form-select form-select-lg border-radius-0_7">
            <option value="0">Selecione</option>
            <option value="1">Alimentação</option>
            <option value="2">Hospedagem</option>
            <option value="3">Transporte</option>
            <option value="4">Serviços</option>
            <option value="5">Outros</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="amount" class="form-label">Valor</label>
          <input type="text" id="amount" class="form-control form-control-lg border-radius-0_7" placeholder="R$ 0,00">
        </div>


        <button type="submit" class="btn bg-green-100 text-white fw-bold border-radius-0_7 disabled">Adicionar
          despesa</button>
      </form>
    </div>

    <div id="right-container">
      <div id="header-right-container"
        class="d-flex justify-content-between align-items-center gray-200 border-bottom border-2 pb-4">
        <div class="d-flex align-items-center gap-3">
          <h4 class="m-0 fw-normal fs-4">Minhas solicitações</h4>
          <span class="fs-4">&bull;</span>
          <p class="m-0 text-uppercase" id="count-expense"></p>
        </div>
        <p class="m-0 d-flex align-items-center gap-2">R$ <span id="total-value"
            class="text-black fw-bold fs-4">00,00</span></p>
      </div>

      <ul role="list" class="expense-list">
        <li id="empty-message" class="gray-200 justify-content-center mt-0">Nenhuma despesa cadastrada
        </li>
      </ul>
    </div>
  </main>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/90b19570b9.js" crossorigin="anonymous"></script>
</body>

</html>
